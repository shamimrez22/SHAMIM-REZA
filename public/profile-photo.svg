<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="avatar-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    <linearGradient id="accent-ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="50%" stop-color="#ea580c" />
      <stop offset="100%" stop-color="#c2410c" />
    </linearGradient>
    <linearGradient id="silhouette-head" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="silhouette-suit" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#f97316" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <circle cx="250" cy="250" r="250" fill="url(#avatar-bg)" />

  <!-- Outer Precision Border -->
  <circle cx="250" cy="250" r="242" fill="none" stroke="url(#accent-ring)" stroke-width="4" filter="url(#glow)" />
  <circle cx="250" cy="250" r="230" fill="none" stroke="#334155" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.4" />

  <!-- Corporate Executive Silhouette Shoulders -->
  <path d="M 60 500 C 75 390, 150 340, 250 340 C 350 340, 425 390, 440 500 Z" fill="url(#silhouette-suit)" />

  <!-- Executive Collar & Tie Accent -->
  <polygon points="250,340 215,400 250,450 285,400" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
  <polygon points="244,350 256,350 262,440 250,470 238,440" fill="url(#accent-ring)" />
  <polygon points="200,345 225,410 248,340" fill="#f8fafc" opacity="0.9" />
  <polygon points="300,345 275,410 252,340" fill="#f8fafc" opacity="0.9" />

  <!-- Executive Head Silhouette -->
  <circle cx="250" cy="210" r="85" fill="#1e293b" stroke="#334155" stroke-width="2" />
  
  <!-- Sleek Professional Monogram SR -->
  <text x="250" y="228" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="62" font-weight="900" fill="#ffffff" letter-spacing="2">SR</text>

  <!-- Small Subtitle -->
  <rect x="160" y="270" width="180" height="24" rx="12" fill="#ea580c" opacity="0.9" />
  <text x="250" y="286" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" fill="#ffffff" letter-spacing="1.5">EXECUTIVE PROFILE</text>
</svg>
