<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="avatar-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    <linearGradient id="accent-ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="50%" stop-color="#ea580c" />
      <stop offset="100%" stop-color="#c2410c" />
    </linearGradient>
    <linearGradient id="silhouette-head" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="silhouette-suit" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#f97316" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <circle cx="250" cy="250" r="250" fill="url(#avatar-bg)" />

  <!-- Outer Precision Border -->
  <circle cx="250" cy="250" r="242" fill="none" stroke="url(#accent-ring)" stroke-width="4" filter="url(#glow)" />
  <circle cx="250" cy="250" r="230" fill="none" stroke="#334155" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.4" />

  <!-- Corporate Executive Silhouette Shoulders -->
  <path d="M 40 500 C 60 380, 140 315, 250 315 C 360 315, 440 380, 460 500 Z" fill="url(#silhouette-suit)" />

  <!-- Executive Neck -->
  <path d="M 195 210 L 195 330 L 305 330 L 305 210 Z" fill="#1e293b" />

  <!-- Executive Collar & Tie Accent -->
  <polygon points="250,315 210,385 250,440 290,385" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
  <polygon points="244,325 256,325 262,435 250,465 238,435" fill="url(#accent-ring)" />
  <polygon points="190,320 220,395 248,315" fill="#f8fafc" opacity="0.95" />
  <polygon points="310,320 280,395 252,315" fill="#f8fafc" opacity="0.95" />

  <!-- Executive Head Silhouette (Prominent & Well-Proportioned) -->
  <circle cx="250" cy="180" r="92" fill="#1e293b" stroke="#334155" stroke-width="2.5" />
  
  <!-- Sleek Professional Monogram SR -->
  <text x="250" y="202" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="68" font-weight="900" fill="#ffffff" letter-spacing="2">SR</text>

  <!-- Small Subtitle Pill -->
  <rect x="150" y="244" width="200" height="26" rx="13" fill="#ea580c" opacity="0.95" />
  <text x="250" y="261" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" fill="#ffffff" letter-spacing="1.5">EXECUTIVE PROFILE</text>
</svg>
